version: 2

project_name: agy-server

before:
  hooks:
    - go mod tidy

builds:
  - id: agy-server
    main: ./cmd/agy-server
    binary: agy-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  # Same program under the name it shipped as before the rename, so existing
  # installs and scripts keep working.
  - id: agy-remote
    main: ./cmd/agy-server
    binary: agy-remote
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - DISCLAIMER.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    **Linux server (always-on Antigravity)**

    ```bash
    curl -fsSL https://raw.githubusercontent.com/AFSlayer/antigravity-server/main/scripts/install.sh | bash
    ```

    **The desktop companion no longer works.**
    Since 2.34.0 the Antigravity desktop app keeps its language server's access token
    from other programs, and the app updates itself, so `agy-server` cannot connect to
    it and the web UI stays blank. To reach
    the Antigravity on your desktop from a phone, use Google's official remote at
    `antigravity.google.com`. See [#98](https://github.com/AFSlayer/antigravity-server/issues/98).

    These builds are not code-signed, so macOS and Windows will warn you about an
    unidentified developer if you download an archive by hand.
